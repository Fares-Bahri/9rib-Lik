<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Gaspillage</title>
  <link rel="stylesheet" href="impact_style.css">
  <script src="impact_javascript.js"></script>
</head>
<body class="back">
<div class="wrap">
  <aside class="side">
    <div class="brand">● 9rib Lik</div>
    <a href="impact_dashboard.html">Tableau de bord</a>
    <a href="back_gaspillage_form.html" class="on">Ajouter une forme de gaspillage</a>
    <a href="back_impact_form.html">Ajouter un impact</a>
    <a href="front_gaspillage_form.html">Retour au site public</a>
    <div class="foot"><div>admin</div><a href="#">Se déconnecter</a></div>
  </aside>
  <div class="main">
    <header class="top"><h1>Ajouter ou modifier une forme de gaspillage</h1><span class="env">BACKOFFICE</span></header>
    <div class="content">
      <section class="card">
        <p class="intro">Laissez l'identifiant vide.</p>
        <form class="f" action="" method="post">
          <label>Identifiant <small>Généré automatiquement</small>
            <input type="number" id="id_gaspillage" name="gaspillage" readonly placeholder="Auto">
          </label>
          <label>Quantité (kg)
            <input type="number" name="id_quantite_gaspillage" name="quantite_gaspillage" min="0.1" step="0.1" required>
          </label>
          <div class="duo">
            <label>Date de signalement
              <input type="date" id="id_date_signalement" name="date_signalement" required>
            </label>
            <label>Date limite
              <input type="date" id="id_date_limite" name="date_limite" required>
            </label>
          </div>
          <label>Statut
            <select name="Statut" required>
              <option value="en_attente">En attente</option>
              <option value="vendu">Vendu</option>
              <option value="perime">Périmé</option>
            </select>
          </label>
          <div class="actions">
            <button class="btn" type="submit">Enregistrer le gaspillage</button>
            <button class="btn sec" type="reset">Annuler</button>
          </div>
        </form>
      </section>
    </div>
  </div>
</div>
</body>
</html>
